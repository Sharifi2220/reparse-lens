name: GitHub preview release
# Audited one-time v0.1.0-preview.2 publication. Subsequent pushes are idempotent.

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "DISCLOSURE"
      - "docs/JSON_API.md"
      - ".github/workflows/release-preview.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "DISCLOSURE"
      - "docs/JSON_API.md"
      - ".github/workflows/release-preview.yml"

permissions:
  contents: read

jobs:
  verify-preview:
    name: Verify preview contents and CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Run CLI and synthetic tests
        run: |
          npm run check
          npm test
          test "$(node src/cli.mjs --version)" = "0.1.0-preview.2"
          node src/cli.mjs doctor --json
      - name: Enforce exact ten-file npm package
        run: |
          npm pack --dry-run --json --ignore-scripts > "${RUNNER_TEMP}/reparse-lens-pack.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const files = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/reparse-lens-pack.json','utf8'))[0].files.map(x => x.path).sort();
          const allow = ['DISCLOSURE','LICENSE','README.md','SECURITY.md','docs/FAQ.md','docs/JSON_API.md','docs/THREAT_MODEL.md','package.json','src/cli.mjs','src/scanner.mjs'].sort();
          if (pkg.version !== '0.1.0-preview.2' || pkg.name !== 'reparse-lens' || pkg.private !== false || pkg.publishConfig?.tag !== 'preview' || pkg.contentPolicy?.class !== 'dual-use') throw Error('Preview package metadata mismatch');
          if (JSON.stringify(files) !== JSON.stringify(allow)) throw Error('Unexpected package archive contents: ' + JSON.stringify(files));
          if (!readFileSync('DISCLOSURE', 'utf8').includes('Dual-Use Disclosure')) throw Error('Root DISCLOSURE is missing or invalid');
          console.log('Verified exactly ten intended npm files and dual-use metadata.');
          JS
      - name: Check npm registry package name (informational)
        run: |
          node --input-type=module <<'JS'
          const url = 'https://registry.npmjs.org/reparse-lens';
          try {
            const r = await fetch(url, { signal: AbortSignal.timeout(10000) });
            if (r.status === 404) console.log('npm registry: package not found (name is not guaranteed claimable).');
            else if (r.ok) console.log('npm registry: package name exists; ownership must be verified before publish.');
            else console.log('npm registry: name check inconclusive (HTTP ' + r.status + ').');
          } catch (e) { console.log('npm registry: unavailable; name remains unverified.'); }
          JS

  publish-github-release:
    name: Create public preview GitHub Release
    if: ${{ github.event_name == 'push' && github.repository == 'Sharifi2220/reparse-lens' }}
    needs: [verify-preview]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create exactly one prerelease at this verified main commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v0.1.0-preview.2
        run: |
          set -eu
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; no duplicate is being published."
            exit 0
          fi
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "A tag named $TAG exists without the expected release. Stopping."
            exit 1
          fi
          cat > "${RUNNER_TEMP}/reparse-preview-notes.md" <<'NOTES'
          ## Reparse Lens 0.1.0-preview.2

          Second experimental source preview of the local, zero-dependency Node.js filesystem metadata inspector. This release updates metadata and disclosure for npm's dual-use content policy; it does not claim a new security capability.

          ### What it does
          - Detects observable symlinks, Windows directory junctions and filesystem scope anomalies that Git inventory may miss.
          - Reports hardlink/Git-worktree uncertainty and optional Windows filename portability hints.
          - Offers text and JSON output with bounded findings, documented exit codes and `authorization: false`.

          ### Use
          Requires Node.js 22+. Download **Source code (zip)** from this release, extract it, then run:
          ```sh
          node src/cli.mjs --help
          node src/cli.mjs doctor --json
          node src/cli.mjs scan . --portable --json
          ```

          ### Validation and limitations
          Release workflow checks source syntax, 27 synthetic tests and a ten-file package allowlist. Cross-platform CI runs on Node 22/24 under Windows, Ubuntu and macOS; fixture SKIPs are not PASS.

          **Experimental, advisory only**: clean Windows scans remain `INCOMPLETE` / exit 3 due to incomplete native NTFS reparse tag coverage; observed junctions are `BLOCKED` / exit 2. No TOCTOU protection, sandboxing, malware detection or security certification. See SECURITY.md and docs/THREAT_MODEL.md.

          The package now explicitly declares dual-use content and includes DISCLOSURE. Direct npm publication is separate and requires interactive, enforced 2FA; no token-bypass or direct OIDC automated publish. Until npm is verifiably available, use the release ZIP/source CLI.
          NOTES
          gh release create "$TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "Reparse Lens 0.1.0-preview.2 (experimental)" --notes-file "${RUNNER_TEMP}/reparse-preview-notes.md" --prerelease --latest=false
