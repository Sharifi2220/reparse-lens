name: Publish Reparse Lens to npm (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_tag:
        description: "Type v0.1.0-preview.1 to confirm first public npm publication"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  npm-preview:
    name: Verify and publish preview-tagged npm package
    if: ${{ github.repository == 'Sharifi2220/reparse-lens' && inputs.confirm_tag == 'v0.1.0-preview.1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the already released tag, not moving main
        uses: actions/checkout@v7
        with:
          ref: refs/tags/v0.1.0-preview.1
          persist-credentials: false
      - name: Prepare Node.js and npm registry
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Update npm for OIDC trusted-publisher compatibility
        run: npm install --global npm@^11
      - name: Verify package, CLI version, source tests and allowlist
        run: |
          npm run check
          npm test
          test "$(node src/cli.mjs --version)" = "0.1.0-preview.1"
          npm pack --dry-run --json --ignore-scripts > "${RUNNER_TEMP}/reparse-npm-pack.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const entry = JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/reparse-npm-pack.json','utf8'))[0];
          const expected = ['LICENSE','README.md','SECURITY.md','docs/FAQ.md','docs/THREAT_MODEL.md','package.json','src/cli.mjs','src/scanner.mjs'].sort();
          if (pkg.name !== 'reparse-lens' || pkg.version !== '0.1.0-preview.1' || pkg.private !== false || pkg.publishConfig?.tag !== 'preview') throw Error('Unexpected manifest');
          if (JSON.stringify(entry.files.map(f => f.path).sort()) !== JSON.stringify(expected)) throw Error('Package allowlist mismatch');
          console.log('Verified exact eight-file npm distribution');
          JS
      - name: Publish experimental npm preview (not latest)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --tag preview
